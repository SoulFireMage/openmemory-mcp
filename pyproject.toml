[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmemory-mcp"
version = "0.2.0"
description = "MCP server providing Claude Desktop access to OpenMemory API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Richard" }
]

dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2"
]

[project.scripts]
openmemory-mcp = "openmemory_mcp:main"
